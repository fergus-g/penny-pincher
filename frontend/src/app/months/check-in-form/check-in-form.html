<form [formGroup]="form" (ngSubmit)="submit()" aria-labelledby="check-in-title">
  <header class="form-header">
    <div class="heading">
      <h2 id="check-in-title">Check in {{ pot().name }}</h2>
      <p class="subtitle">{{ subtitle() }}</p>
    </div>
    <button
      type="button"
      class="close"
      aria-label="Close"
      [disabled]="saving()"
      (click)="cancelled.emit()"
    >
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path d="M6 6l12 12M18 6L6 18" />
      </svg>
    </button>
  </header>

  <div class="form-body">
    <div class="field">
      <label for="check-in-balance">Actual balance</label>
      <div class="money">
        <span aria-hidden="true">€</span>
        <input
          id="check-in-balance"
          type="number"
          inputmode="decimal"
          formControlName="balance"
          min="0"
          step="0.01"
        />
      </div>
      @if (balance.touched && balance.invalid) {
        <small class="error">Enter 0 or more, at most 2 decimal places</small>
      }
    </div>

    <div class="note" role="note">
      Later months are worked out from this balance. Use it when the real balance has drifted from
      what's shown.
    </div>

    @if (error(); as error) {
      <p class="error" role="alert">{{ error }}</p>
    }
  </div>

  <footer class="form-footer">
    <div class="actions">
      <button type="button" class="secondary" [disabled]="saving()" (click)="cancelled.emit()">
        Cancel
      </button>
      <button type="submit" class="primary" [disabled]="saving()">
        {{ saving() ? 'Saving…' : 'Save check-in' }}
      </button>
    </div>
  </footer>
</form>
