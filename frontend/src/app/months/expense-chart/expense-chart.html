<section class="card" aria-labelledby="expense-chart-title">
  <h2 id="expense-chart-title">Expenses by category</h2>
  @if (bars().length === 0) {
    <p class="empty">No expenses this month</p>
  } @else {
    <ul class="bars">
      @for (bar of bars(); track bar.label) {
        <li>
          <span class="label">{{ bar.label }}</span>
          <div class="track" aria-hidden="true">
            <div class="fill" [style.width.%]="bar.width"></div>
          </div>
          <span class="amount">{{ bar.amount | currency: 'EUR' }}</span>
          <span class="percent">{{ bar.percent }}%</span>
        </li>
      }
    </ul>
  }
</section>
