<section class="card" aria-labelledby="expense-chart-title">
  <h2 id="expense-chart-title">Expenses by category</h2>
  @if (slices().length === 0) {
    <p class="empty">No expenses this month</p>
  } @else {
    <!-- The whole pie is one button: hover a slice for its figures, click for the full list. -->
    <button
      type="button"
      class="chart-button"
      [attr.aria-label]="'Expenses by category: ' + summary() + '. Show details'"
      (click)="openDetails()"
    >
      <div class="chart">
        <canvas
          baseChart
          type="pie"
          role="img"
          [attr.aria-label]="'Pie chart of expenses: ' + summary()"
          [data]="data()"
          [options]="options"
        ></canvas>
      </div>
    </button>
  }
</section>

<dialog #details aria-labelledby="expense-details-title" (close)="showingDetails.set(false)">
  @if (showingDetails()) {
    <header class="details-header">
      <h2 id="expense-details-title">Expenses by category</h2>
      <button type="button" class="close" aria-label="Close" (click)="closeDetails()">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
    </header>
    <div class="body">
      <div class="chart large">
        <canvas
          baseChart
          type="pie"
          role="img"
          [attr.aria-label]="'Pie chart of expenses: ' + summary()"
          [data]="data()"
          [options]="options"
        ></canvas>
      </div>
      <!-- The legend, and the figures for anyone who can't read the chart. -->
      <ul class="slices">
        @for (slice of slices(); track slice.label) {
          <li>
            <span class="swatch" [style.background]="slice.colour" aria-hidden="true"></span>
            <span class="label">{{ slice.label }}</span>
            <span class="amount">{{ slice.amount | currency: 'EUR' }}</span>
            <span class="percent">{{ slice.percent }}%</span>
          </li>
        }
      </ul>
    </div>
  }
</dialog>
